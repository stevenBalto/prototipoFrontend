<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 20px; display:flex; justify-content:center;">
  <div style="width: 380px; background:#FAF7F2; border-radius:18px; overflow:hidden; border:0.5px solid var(--color-border-tertiary); font-family: var(--font-sans);">

    <div style="background:#1E1E1E; padding:16px 18px;">
      <span style="font-size:15px; font-weight:600; color:#fff;">Crear usuario</span>
    </div>

    <div style="padding:18px;">
      <div style="margin-bottom:12px;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:5px;">Nombre completo</div>
        <div style="background:#fff; border:0.5px solid #A8895E; border-radius:10px; padding:9px 11px; font-size:11px; color:#9a9a9a;">Ej: Bryan Vega Ordoñez</div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:5px;">Correo electrónico</div>
        <div style="background:#fff; border:0.5px solid #A8895E; border-radius:10px; padding:9px 11px; font-size:11px; color:#9a9a9a;">correo@rooster.com</div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:5px;">Teléfono (opcional)</div>
        <div style="background:#fff; border:0.5px solid #A8895E; border-radius:10px; padding:9px 11px; font-size:11px; color:#9a9a9a;">8888-8888</div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:5px;">Contraseña temporal</div>
        <div style="background:#fff; border:0.5px solid #A8895E; border-radius:10px; padding:9px 11px; font-size:11px; color:#9a9a9a; display:flex; justify-content:space-between;"><span>••••••••</span><i class="ti ti-refresh" style="color:#E13642; font-size:13px;" aria-hidden="true"></i></div>
        <div style="font-size:8px; color:#A8895E; margin-top:3px;">Se enviará por correo, el usuario deberá cambiarla</div>
      </div>

      <div style="margin-bottom:14px;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:6px;">Rol</div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1; text-align:center; background:#fff; border:2px solid #E13642; border-radius:10px; padding:10px 0;">
            <i class="ti ti-user" style="color:#E13642; font-size:18px;" aria-hidden="true"></i>
            <div style="font-size:10px; font-weight:600; color:#E13642; margin-top:4px;">Usuario</div>
          </div>
          <div style="flex:1; text-align:center; background:#fff; border:1px solid #A8895E; border-radius:10px; padding:10px 0;">
            <i class="ti ti-user-shield" style="color:#A8895E; font-size:18px;" aria-hidden="true"></i>
            <div style="font-size:10px; color:#1E1E1E; margin-top:4px;">Superadministrador</div>
          </div>
        </div>
      </div>

      <div style="margin-bottom:16px; opacity:0.4;">
        <div style="font-size:10px; color:#A8895E; margin-bottom:5px;">Sucursal asignada <span style="font-size:8px;">(solo si es Superadmin)</span></div>
        <div style="background:#eee; border:0.5px solid #ccc; border-radius:10px; padding:9px 11px; font-size:11px; color:#9a9a9a;">Sucursal Liberia ▾</div>
      </div>

      <button style="width:100%; background:#E13642; color:#fff; border:none; padding:12px; border-radius:12px; font-size:12px; font-weight:600;">Crear usuario</button>
    </div>

  </div>
</div>
